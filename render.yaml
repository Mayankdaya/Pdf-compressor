version: "1"
services:
  - type: web
    name: greenpdf-ai-empire
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
